# The user guide (zensical.toml, docs/) on GitHub Pages, one folder per version on the gh-pages branch (mike).
# main publishes "dev"; a release tag vX.Y.Z publishes "X.Y", moves the "latest" alias to it and makes it the default.
# Pages must serve the gh-pages branch (Settings > Pages > Deploy from a branch).
name: Documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [docs/**, overrides/**, zensical.toml, README.md, .github/workflows/docs.yml]
  # A manual run with `release` set republishes that version ("latest") from the chosen branch: for docs fixes that
  # apply to the current release but were committed after its tag.
  workflow_dispatch:
    inputs:
      release:
        description: Republish this X.Y version as "latest" (leave empty for "dev")
        required: false
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Zensical is not pinned: it moves fast and the guide follows its latest release. Zensical's fork of mike (not on
      # PyPI) stays pinned to a commit; it imports zensical.config and runs `zensical build`.
      - run: |
          uv tool install zensical
          uv tool install --with zensical git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac
      # The strict build fails on broken links before mike publishes anything.
      - run: zensical build --clean --strict
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "${version%.*}" latest
          mike set-default --push latest
      - if: ${{ inputs.release != '' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mike deploy --push --update-aliases "$RELEASE" latest
          mike set-default --push latest
        env:
          RELEASE: ${{ inputs.release }}
      - if: ${{ !inputs.release && !startsWith(github.ref, 'refs/tags/v') }}
        run: mike deploy --push dev
