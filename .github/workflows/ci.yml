# Checks that run without Unreal Engine, Houdini, OpenUSD or a ray-tracing GPU.
# Rendering, Hydra and Solaris coverage stays in scripts/Verify.ps1 and scripts/Test-Houdini.ps1 (see VERIFICATION.md).
name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Client library and C ABI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DHDUE_BUILD_HYDRA=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: ABI layout test
        run: ctest --test-dir build -C Release --output-on-failure

  format:
    name: Formatting and lint
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Python (Black, Ruff; pyproject.toml)
        run: |
          uvx black@24.10.0 --check scripts tests integrations
          uvx ruff@0.7.4 check scripts tests integrations
      - name: C++ and shaders (clang-format)
        shell: pwsh
        run: |
          uvx --from clang-format==19.1.5 clang-format --dry-run --Werror (git ls-files '*.cpp' '*.h' '*.hpp' '*.c')
          if ($LASTEXITCODE) { exit 1 }
      - name: PowerShell (PSScriptAnalyzer, Invoke-Formatter)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $files = Get-ChildItem -Recurse -Include *.ps1 -Path scripts, tests, packaging, integrations
          $findings = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 }
          $findings | Format-Table -AutoSize
          $unformatted = $files | Where-Object { $text = [IO.File]::ReadAllText($_.FullName); (Invoke-Formatter -ScriptDefinition $text) -ne $text }
          $unformatted | ForEach-Object { Write-Output "::error file=$($_.FullName)::not formatted (Invoke-Formatter)" }
          if ($findings -or $unformatted) { exit 1 }

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color

  cpp-lint:
    name: clang-tidy (client library)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure with compile commands
        run: cmake -S . -B tidy -G Ninja -DHDUE_BUILD_HYDRA=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        shell: pwsh
        run: |
          # The Hydra delegate and UE backend need USD, Houdini or UE, which runners lack: they are checked locally.
          $out = clang-tidy -p tidy --quiet (Get-ChildItem src/client/*.cpp).FullName 2>&1
          $out
          if ($out -match 'warning:|error:') { exit 1 }

  scripts:
    name: Python and PowerShell
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false # no lock file; scripts run with uv run
      - name: Byte-compile Python (Houdini 22 uses 3.13)
        run: uv run --python 3.13 python -m compileall -q scripts tests integrations
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 -Path scripts, tests, packaging, integrations | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) { $failed++; Write-Output "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($failed) { exit 1 }
      - name: Unit suite (repository scope, local paths, usd-core tests, gallery brightness bands)
        shell: pwsh
        run: ./scripts/Test.ps1 -Suite unit
      - name: Package installer (Windows PowerShell 5.1, as Install.cmd runs it)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'hdue'; $packages = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force "$root/plugin/Release", "$root/integrations/houdini" | Out-Null
          '{"houdini_build": "22.0.368", "hdue_version": "v0.2.0"}' | Set-Content "$root/runtime.json"; '' | Set-Content "$root/plugin/Release/hdUE_Houdini22.dll"
          '{}' | Set-Content "$root/integrations/houdini/UsdRenderers.json"
          Copy-Item packaging/houdini/*.ps1 $root
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root/Install.ps1" -PackagesDirectory $packages
          if ($LASTEXITCODE) { throw 'Install.ps1 failed' }
          $package = Get-Content "$packages/hdUE.json" -Raw | ConvertFrom-Json
          if ($package.hpath -ne '$HDUE/integrations/houdini' -or -not $package.load_package_once -or $package.enable -notmatch "houdini_version >= '22.0.368' .*houdini_os == 'windows'" -or
              ($package.env | Where-Object { $_.PXR_PLUGINPATH_NAME }).PXR_PLUGINPATH_NAME.method -ne 'append') { throw "Unexpected package: $($package | ConvertTo-Json -Depth 5)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root/Uninstall.ps1" -PackagesDirectory $packages
          if (Test-Path "$packages/hdUE.json") { throw 'Uninstall.ps1 left the package file' }
