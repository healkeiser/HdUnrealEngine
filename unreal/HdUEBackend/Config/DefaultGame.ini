[/Script/UnrealEd.ProjectPackagingSettings]
bUsePakFile=False
bUseIoStore=False
bUseZenStore=False
+MapsToCook=(FilePath="/Game/HdUETest")
+DirectoriesToAlwaysCook=(Path="/Game/HdUE")
; The buffer debug views (unreal:debugView buffer:*) draw these materials.
+DirectoriesToAlwaysCook=(Path="/Engine/BufferVisualization")
; UVolumetricCloudComponent's default material (a soft reference: VolumetricCloudComponent.cpp).
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
; UGroomComponent's default hair material (unreal:groom curves).
+DirectoriesToAlwaysCook=(Path="/HairStrands/Materials")
; Import pipelines run in the editor commandlet; the runtime only uses their
; cooked Material/Texture results and does not link the Interchange importer.
+DirectoriesToNeverCook=(Path="/Interchange/Pipelines")
; MetaHuman Creator authoring descriptors/pipelines are not placeable runtime assets.
; The assembled MetaHumans under /Game/MetaHumans are cooked normally.
+DirectoriesToNeverCook=(Path="/Game/MH")
+DirectoriesToNeverCook=(Path="/MetaHumanCharacter")


[ShaderPipelineCache.CacheFile]
; The bundled PSO cache is tagged with this version and skipped when the runtime's differs. Pin it: otherwise the
; launcher editor that cooks writes its changelist and the source-built runtime (changelist 0) ignores the cache.
GameVersion=1
