[/Script/Engine.Engine]
bUseFixedFrameRate=False
; Offline renders tick as fast as the GPU allows; frame smoothing would sleep to ~62 fps.
bSmoothFrameRate=False

[/Script/Engine.VirtualTexturePoolConfig]
; Per physical format pool. Four 4K color/normal UDIM tiles need 5461 pages
; each including mip levels; UE's 64 MiB default BC5 pool holds only 3599.
DefaultSizeInMegabyte=128


[DevOptions.Shaders]
; Stable shader keys (cook metadata) turn PSOs recorded by Record-PipelineCache.ps1 into the bundled PSO cache.
NeedsShaderStableKeys=true

[SystemSettings]
; Runtime meshes and materials compile their PSOs on first use. Draw them with the default material meanwhile (2)
; instead of skipping them (1, UE's default), which left the first frames and new materials blank.
r.PSOPrecache.ProxyCreationStrategy=2
