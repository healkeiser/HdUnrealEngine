[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/HdUETest
EditorStartupMap=/Game/HdUETest

[/Script/Engine.RendererSettings]
; Alpha output: post-processing keeps coverage in scene colour, so the beauty carries alpha 0 where no geometry is.
; Set here (Project Settings > Rendering), not at run time: global compute PSOs are precached at startup for the
; alpha setting then in effect (TSR's FAlphaChannelDim), and setting it after made TSR miss its precache.
r.PostProcessing.PropagateAlpha=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.Substrate.ProjectClosuresPerPixel=4
r.Substrate.ProjectClosuresPerPixelOverride=1
r.Substrate.BytesPerPixel=128
r.VirtualTextures=True
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.PathTracing=True
r.Lumen.HardwareRayTracing=True
r.MegaLights.EnableForProject=True
r.MegaLights.Allowed=1
; Virtual Shadow Maps, as in new UE projects. Sponza in Lumen: 1.01x the Path Tracer's mean (cascaded shadow maps 0.90x,
; the sun-lit cypress darkened by its own leaves).
r.Shadow.Virtual.Enable=1
; Heterogeneous volumes cast shadows onto the scene (the project's Heterogeneous Volumes "Shadow Casting" setting; UE's
; Path Tracer and Karma shadow volumes too). Lights shaded by MegaLights do not receive these shadows in UE 5.8.
r.HeterogeneousVolumes.Shadows=1
; One shadow projection fitted around the volumes: with Virtual Shadow Maps, the default single cascade (1) takes the
; clipmap's cascade settings and its volumetric shadow map came out empty (no shadow in realtime; volume/shadow).
r.HeterogeneousVolumes.Shadows.Cascades=0
r.SkinCache.CompileShaders=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D12TargetedShaderFormats=PCD3D_SM5
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.Engine]
bUseFixedFrameRate=False
; Offline renders tick as fast as the GPU allows; frame smoothing would sleep to ~62 fps.
bSmoothFrameRate=False

[/Script/Engine.VirtualTexturePoolConfig]
; Per physical format pool. Four 4K color/normal UDIM tiles need 5461 pages
; each including mip levels; UE's 64 MiB default BC5 pool holds only 3599.
DefaultSizeInMegabyte=128


[DevOptions.Shaders]
; Stable shader keys (cook metadata) turn PSOs recorded by Record-PipelineCache.ps1 into the bundled PSO cache.
NeedsShaderStableKeys=true

[SystemSettings]
; In a job with a memory limit (a farm's container, a test's memory cap), the available memory UE
; reports is the job's (FWindowsPlatformMemory::GetStats), so interactive background mesh builds start only while their
; estimate fits it. Outside a job it changes nothing.
memory.WindowsPlatformMemoryUseContainerMemory=1
; Virtual texture physical pools grow when oversubscribed, as UE's editor does (UVirtualTexturePoolConfig
; bPoolAutoGrowInEditor, true by default); games keep fixed pools (r.VT.PoolAutoGrow, false). Scenes of many large
; virtual textures (NVIDIA's Da Vinci Workshop) otherwise sampled other textures' pages: speckle over every surface.
r.VT.PoolAutoGrow=1
; Runtime meshes and materials compile their PSOs on first use. Draw them with the default material meanwhile (2)
; instead of skipping them (1, UE's default), which left the first frames and new materials blank.
r.PSOPrecache.ProxyCreationStrategy=2
