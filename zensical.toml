# The hdUE user guide: uvx zensical serve (preview), uvx zensical build --clean (writes site/).
[project]
site_name = "hdUE"
site_description = "Unreal Engine 5.8 as a Hydra render delegate for Houdini Solaris, husk and usdview"
repo_url = "https://github.com/healkeiser/HdUnrealEngine"
repo_name = "healkeiser/HdUnrealEngine"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "hdUE is MIT-licensed. Unreal Engine is a trademark of Epic Games, Inc."
extra_css = ["assets/hdue.css"]
extra_javascript = ["assets/hdue.js"]
# Audit reports are dated records of the repository, not user documentation.
exclude_docs = """
/audit/
/images/*.py
/images/*.html
__pycache__/
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Your first render" = "getting-started/first-render.md" },
    { "Environment variables" = "getting-started/environment-variables.md" },
  ] },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Lighting an interior" = "tutorials/lighting-an-interior.md" },
    { "Lumen or the Path Tracer" = "tutorials/lumen-or-path-tracer.md" },
    { "Removing noise" = "tutorials/removing-noise.md" },
    { "Exposure and tone" = "tutorials/exposure-and-tone.md" },
    { "Depth of field and motion blur" = "tutorials/depth-of-field-and-motion-blur.md" },
  ] },
  { "Houdini" = [
    "houdini/index.md",
    { "Solaris viewport" = "houdini/viewport.md" },
    { "Rendering with husk" = "houdini/husk.md" },
    { "Live Render and Copernicus" = "houdini/live-render.md" },
    { "Substrate materials" = "houdini/substrate-materials.md" },
  ] },
  { "Render output" = [
    { "AOVs" = "output/aovs.md" },
    { "Alpha" = "output/alpha.md" },
  ] },
  { "Rendering" = [
    { "Render settings" = "rendering/render-settings.md" },
    { "Denoising" = "rendering/denoising.md" },
    { "Motion blur" = "rendering/motion-blur.md" },
    { "Colour management" = "rendering/color-management.md" },
    { "Post-processing" = "rendering/post-processing.md" },
    { "Engine quality" = "rendering/engine-quality.md" },
    { "Debug views" = "rendering/debug-views.md" },
  ] },
  { "Cameras" = "cameras.md" },
  { "Lights" = "lights.md" },
  { "Materials" = [
    { "Overview" = "materials.md" },
    { "Preview Surface" = "materials/preview-surface.md" },
    { "MaterialX surfaces" = "materials/materialx-surfaces.md" },
    { "Opacity and glass" = "materials/opacity-and-glass.md" },
    { "COP and embedded textures" = "materials/cop-textures.md" },
    { "Substrate Builder" = "substrate-builder.md" },
    { "Wet surfaces" = "wet-surface-layer.md" },
  ] },
  { "Geometry" = [
    { "Meshes, curves and points" = "geometry/meshes.md" },
    { "Subdivision surfaces" = "geometry/subdivision.md" },
    { "Displacement" = "geometry/displacement.md" },
    { "Nanite" = "geometry/nanite.md" },
  ] },
  { "Environment" = [
    { "Volumes" = "environment/volumes.md" },
    { "Fog" = "environment/fog.md" },
    { "Sky and clouds" = "environment/sky.md" },
  ] },
  { "Reference" = [
    { "Render settings" = [
      "reference/render-settings/index.md",
      { "Rendering" = "reference/render-settings/rendering.md" },
      { "Lens" = "reference/render-settings/lens.md" },
      { "Color Grading" = "reference/render-settings/color-grading.md" },
      { "Lighting" = "reference/render-settings/lighting.md" },
      { "Fog" = "reference/render-settings/fog.md" },
      { "Sky" = "reference/render-settings/sky.md" },
      { "Rendering Features" = "reference/render-settings/rendering-features.md" },
      { "Engine Quality" = "reference/render-settings/engine-quality.md" },
    ] },
    { "Light properties" = "reference/light-properties.md" },
    { "USD prim types" = "reference/usd-prims.md" },
    { "USD conformance" = "conformance.md" },
  ] },
  { "Gallery" = "gallery.md" },
  { "Developer" = [
    { "Architecture" = "architecture.md" },
    { "Building from source" = "building.md" },
    { "Writing the user guide" = "developer/writing-docs.md" },
    { "Internals" = [
      { "Rendering" = "developer/internals/rendering.md" },
      { "Post-processing and AOVs" = "developer/internals/post-processing-and-aovs.md" },
      { "Materials" = "developer/internals/materials.md" },
      { "Substrate Builder" = "developer/internals/substrate-builder.md" },
      { "Wet surfaces" = "developer/internals/wet-surfaces.md" },
      { "Geometry" = "developer/internals/geometry.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 3 }
pymdownx.details = {}
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true }
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
