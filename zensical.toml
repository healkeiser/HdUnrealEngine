[project.theme]
language = "en"
# The hdUE icon (integrations/houdini/config/Icons/HDUE_hdue.svg): docs_dir only serves files under docs/.
logo = "assets/logo.svg"
# The pager cards, the contents column's foot and mike's banner (overrides/).
custom_dir = "overrides"
favicon = "assets/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Lucide everywhere, as in the pages' own :lucide-*: icons; Lucide has no brand marks, so GitHub's comes from FontAwesome.
[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"
top = "lucide/arrow-up"
menu = "lucide/menu"
search = "lucide/search"
share = "lucide/share-2"
close = "lucide/x"
previous = "lucide/arrow-left"
next = "lucide/arrow-right"

[project.theme.icon.admonition]
note = "lucide/pencil-line"
abstract = "lucide/clipboard-list"
info = "lucide/info"
tip = "lucide/lightbulb"
success = "lucide/circle-check"
question = "lucide/circle-help"
warning = "lucide/triangle-alert"
failure = "lucide/circle-x"
danger = "lucide/zap"
bug = "lucide/bug"
example = "lucide/flask-conical"
quote = "lucide/quote"

# Follows the system until the reader picks light or dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Versions are published by mike (.github/workflows/docs.yml): this shows the selector over its versions.json.
[project.extra.version]
provider = "mike"
default = "latest"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/healkeiser/HdUnrealEngine"
name = "hdUE on GitHub"

# Click a page image to see it full size; the setting comparisons (hdue.js) are built after it and stay sliders.
# Canonical links name the "latest" folder, so search engines index one copy of each page.
[project.plugins.mike]
canonical_version = "latest"

[project.plugins.glightbox]
skip_classes = ["hdue-node-icon"]

[project.plugins.minify]
minify_html = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 3 }
pymdownx.details = {}
# Formulas: $...$ inline, $$...$$ as a block, typeset by MathJax on the pages that have one (assets/hdue.js).
pymdownx.arithmatex = { generic = true }
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true }
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
# The glossary: every page gets its abbreviations, shown as tooltips (content.tooltips).
pymdownx.snippets = { base_path = ["."], check_paths = true, auto_append = ["docs/includes/glossary.md"] }
pymdownx.blocks.caption = {}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.mark = {}
pymdownx.tilde = {}
pymdownx.keys = {}
pymdownx.smartsymbols = {}
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
